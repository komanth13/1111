name: Build SlimTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reconstruct SlimTrack source
        shell: bash
        run: |
          mkdir -p project
          cat build_source/part_*.txt > slimtrack_source.b64
          base64 --decode slimtrack_source.b64 > slimtrack_source.zip
          unzip -q slimtrack_source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk SlimTrack-3.2.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SlimTrack-3.2.0-debug-apk
          path: SlimTrack-3.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
