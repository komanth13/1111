name: Build SlimTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reconstruct SlimTrack source
        shell: bash
        run: |
          mkdir -p project
          cat build_source/part_*.txt > slimtrack_source.b64
          base64 --decode slimtrack_source.b64 > slimtrack_source.zip
          unzip -q slimtrack_source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Apply build fixes
        shell: python
        run: |
          from pathlib import Path

          repo = Path("project")

          room = repo / "app/src/main/java/com/example/data/repository/RoomFitnessRepository.kt"
          s = room.read_text()
          s = s.replace(
              """    override suspend fun addWater(date: String, amountMl: Int) = waterDao.insertWaterLog(
        WaterLog(date = date, amountMl = amountMl)
    )""",
              """    override suspend fun addWater(date: String, amountMl: Int) {
        waterDao.insertWaterLog(WaterLog(date = date, amountMl = amountMl))
    }"""
          )
          room.write_text(s)

          admin = repo / "app/src/main/java/com/example/ui/components/AdminPaymentRequisitesSection.kt"
          s = admin.read_text()
          anchor = "import com.example.ui.theme.ProteinBlue\n"
          if "import com.example.util.StringKey" not in s:
              s = s.replace(anchor, anchor + "import com.example.util.StringKey\nimport com.example.util.appString\n")
          admin.write_text(s)

          receipt = repo / "app/src/main/java/com/example/ui/components/PaymentReceiptDialog.kt"
          s = receipt.read_text().replace(
              "StringKey.DIALOG_RECEIPT_PAID_BADGE",
              "StringKey.DIALOG_RECEIPT_PENDING_BADGE"
          )
          receipt.write_text(s)


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk SlimTrack-3.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimTrack-3.2.0-debug-apk
          path: SlimTrack-3.2.0-debug.apk
          if-no-files-found: error
          retention-days: 30
