name: Build SlimTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reconstruct SlimTrack source
        shell: bash
        run: |
          mkdir -p project
          cat build_source/part_*.txt > slimtrack_source.b64
          base64 --decode slimtrack_source.b64 > slimtrack_source.zip
          unzip -q slimtrack_source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Apply fixed source files
        shell: bash
        run: |
          mkdir -p project/app/src/main/java/com/example/data/network
          cp overrides/RoomFitnessRepository.kt project/app/src/main/java/com/example/data/repository/RoomFitnessRepository.kt
          cp overrides/AdminPaymentRequisitesSection.kt project/app/src/main/java/com/example/ui/components/AdminPaymentRequisitesSection.kt
          cp overrides/PaymentReceiptDialog.kt project/app/src/main/java/com/example/ui/components/PaymentReceiptDialog.kt
          cp overrides/AppContainer.kt project/app/src/main/java/com/example/app/AppContainer.kt
          cp overrides/RemoteFoodDataSource.kt project/app/src/main/java/com/example/data/network/RemoteFoodDataSource.kt
          cp overrides/OpenFoodFactsClient.kt project/app/src/main/java/com/example/data/network/OpenFoodFactsClient.kt
          mkdir -p project/app/src/main/java/com/example/domain/model
          cp overrides/BarcodeLookupException.kt project/app/src/main/java/com/example/domain/model/BarcodeLookupException.kt
          cp overrides/BarcodeScannerDialog.kt project/app/src/main/java/com/example/ui/components/BarcodeScannerDialog.kt
          cp overrides/AddFoodDialog.kt project/app/src/main/java/com/example/ui/components/AddFoodDialog.kt
          cp overrides/DiaryScreen.kt project/app/src/main/java/com/example/ui/screens/DiaryScreen.kt
          cp overrides/FitnessViewModel.kt project/app/src/main/java/com/example/ui/viewmodel/FitnessViewModel.kt
          cp overrides/LocalizationManager.kt project/app/src/main/java/com/example/util/LocalizationManager.kt
          mkdir -p project/app/src/test/java/com/example/data/network
          cp overrides/tests/OpenFoodFactsClientTest.kt project/app/src/test/java/com/example/data/network/OpenFoodFactsClientTest.kt
          cp overrides/tests/CalorieCalculatorTest.kt project/app/src/test/java/com/example/CalorieCalculatorTest.kt
          cp overrides/tests/RoomFitnessRepositoryTest.kt project/app/src/test/java/com/example/data/repository/RoomFitnessRepositoryTest.kt
          cp overrides/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts

      - name: Prepare stable test signing key
        shell: bash
        run: |
          mkdir -p project/ci
          base64 --decode ci/slimtrack-test.keystore.b64 > project/ci/slimtrack-test.keystore
          keytool -list -keystore project/ci/slimtrack-test.keystore -storepass slimtracktest -alias slimtracktest >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest

      - name: Smoke check live online catalogue
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYAPI'
          import json, urllib.request
          endpoint = "https://world.openfoodfacts.org/api/v3/product/3017620422003?fields=code,product_name,nutrition,nutriments"
          request = urllib.request.Request(endpoint, headers={"User-Agent": "SlimTrack/3.3.2 (https://github.com/komanth13/1111)", "Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:
              data = json.load(response)
          product = data.get("product", {})
          assert product.get("code") == "3017620422003", "Expected known online barcode"
          legacy = product.get("nutriments", {})
          modern = product.get("nutrition", {}).get("aggregated_set", {})
          assert legacy or modern, "Expected online nutrition data"
          print("Live product:", product.get("product_name"))
          print("Legacy fields:", sorted(legacy.keys())[:12])
          print("Modern per:", modern.get("per"), "preparation:", modern.get("preparation"))
          print("Modern nutrients:", sorted(modern.get("nutrients", {}).keys())[:12])
          PYAPI

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging project/app/build/outputs/apk/debug/app-debug.apk | head -n 3
          "$APKSIGNER" verify --verbose --print-certs project/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk SlimTrack-3.3.2-online-barcode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimTrack-3.3.2-online-barcode-apk
          path: SlimTrack-3.3.2-online-barcode.apk
          if-no-files-found: error
          retention-days: 30

