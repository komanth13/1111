name: Build SlimTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reconstruct SlimTrack source
        shell: bash
        run: |
          mkdir -p project
          cat build_source/part_*.txt > slimtrack_source.b64
          base64 --decode slimtrack_source.b64 > slimtrack_source.zip
          unzip -q slimtrack_source.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Apply fixed source files
        shell: bash
        run: |
          mkdir -p project/app/src/main/java/com/example/data/network
          cp overrides/RoomFitnessRepository.kt project/app/src/main/java/com/example/data/repository/RoomFitnessRepository.kt
          cp overrides/AdminPaymentRequisitesSection.kt project/app/src/main/java/com/example/ui/components/AdminPaymentRequisitesSection.kt
          cp overrides/PaymentReceiptDialog.kt project/app/src/main/java/com/example/ui/components/PaymentReceiptDialog.kt
          cp overrides/AppContainer.kt project/app/src/main/java/com/example/app/AppContainer.kt
          cp overrides/RemoteFoodDataSource.kt project/app/src/main/java/com/example/data/network/RemoteFoodDataSource.kt
          cp overrides/OpenFoodFactsClient.kt project/app/src/main/java/com/example/data/network/OpenFoodFactsClient.kt
          cp overrides/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts

      - name: Prepare stable test signing key
        shell: bash
        run: |
          mkdir -p project/ci
          base64 --decode ci/slimtrack-test.keystore.b64 > project/ci/slimtrack-test.keystore
          keytool -list -keystore project/ci/slimtrack-test.keystore -storepass slimtracktest -alias slimtracktest >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        continue-on-error: true
        working-directory: project
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK identity and signature
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          "$AAPT2" dump badging project/app/build/outputs/apk/debug/app-debug.apk | head -n 3
          "$APKSIGNER" verify --verbose --print-certs project/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk SlimTrack-3.3.1-stable-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimTrack-3.3.1-stable-test-apk
          path: SlimTrack-3.3.1-stable-test.apk
          if-no-files-found: error
          retention-days: 30
